  /usage/query:
    get:
      summary: Query usage records
      description: |
        **Note:** This operation is available only if Active Rating is enabled. The Active Rating feature is in development. If you wish to have access to the feature, submit a request at [Zuora Global Support](http://support.zuora.com/).

        Retrieves information about usage records.

        You can specify certain response fields you want to retrieve by specifying the `fields` and `filters` query parameters. By default, all the response fields are returned in the response.
      operationId: GET_UsageRecordsQuery
      tags:
        - Usage (with Active Rating)
      parameters:
        - $ref: '#/parameters/GLOBAL_HEADER_Authorization_OAuth'
        - $ref: '#/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
        - $ref: '#/parameters/GLOBAL_HEADER_Zuora_Track_Id'
        - name: fields
          in: query
          description: |
            The fields of the usage records you want to retrieve. By default, all the fields in the **Responses** section are returned.

            Use commas to separate the field names. You can specify any fields described in the **Responses** section. For example: `/usage/query?fields=tag,quantity,id`
          required: false
          type: string
        - name: filters
          in: query
          description: |
            This parameter restricts the data returned in the response. You can use this parameter to supply a dimension you want to filter on.

            A single filter uses the following form:

            *field_name* *operator* *field_value*

            Supported operators: `=`, `!=`, `>`, `<`, `>=`, `<=`, `IS NULL`, `IS NOT NULL`, `IN` (The letters are not case sensitive.)

            You can specify any fields except for the custom fields described in the **Responses** section. Filters can be combined using the `AND` boolean logic. For example: *field_name* *operator* *field_value* AND *field_name* *operator* *field_value*

            Currently, the fields in filters must include at least one of the following fields: `accountNumber`, `status`, `uniqueKey`, and `updatedOn`.

            Examples:

            - /usage/query?filters= (id ='035e35bd-880a-47c9-99df-830143b13aed' AND status='Pending')

            - /usage/query?fields=tag,id&filters= (quantity > 10 AND status='Pending')

            - /usage/query?filters=(status in ('Pending','Rated'))
          required: false
          type: string
        - $ref: '#/parameters/GLOBAL_HEADER_page_Usage'
        - $ref: '#/parameters/GLOBAL_HEADER_pageSize_Usage'
      responses:
        '200':
          description: OK
          headers:
            Zuora-Request-Id:
              type: string
              minLength: 36
              maxLength: 36
              description: |
                The Zuora internal identifier of the API call. You cannot control the value of this header.
            Zuora-Track-Id:
              type: string
              maxLength: 64
              description: |
                A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.
          schema:
            $ref: '#/definitions/QueryUsageResponseType'
          examples:
            application/json:
              data:
                - id: 63b75b21-64a8-410e-a391-13865261933c
                  accountNumber: A000003
                  tag: ChargeNumber:C-00000001
                  quantity: 50
                  unitOfMeasure: Each
                  groupId: B
                  startDateTime: '2017-02-03T00:00:00Z'
                  uniqueKey: null
                  description: null
                  importId: null
                  fileName: null
                  status: Pending
                  customFields:
                    username: Grace
                    age: 28
                  createdOn: '2017-11-23T07:52:08.673Z'
                  createdBy: c189f9bd-e529-457a-9b8a-102fe0a5bc4f
                  updatedOn: '2017-11-23T07:52:08.673Z'
                  updatedBy: c189f9bd-e529-457a-9b8a-102fe0a5bc4f
        '500':
          description: Internal Server Error
          headers:
            Zuora-Request-Id:
              type: string
              minLength: 36
              maxLength: 36
              description: |
                The Zuora internal identifier of the API call. You cannot control the value of this header.
            Zuora-Track-Id:
              type: string
              maxLength: 64
              description: |
                A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.
          schema:
            $ref: '#/definitions/CommonUsageErrorResponse'
          examples:
            application/json:
              error:
                message: An internal error occurred. Please retry the request.
  /usage/stream-query:
    get:
      summary: Query usage records in stream
      description: |
        **Note:** This operation is available only if Active Rating is enabled. The Active Rating feature is in development. If you wish to have access to the feature, submit a request at [Zuora Global Support](http://support.zuora.com/).

        Retrieves information about usage records in a stream without pagination.

        You can specify certain response fields you want to retrieve by sepcifying the `fields` and `filters` query parameters. By default, all the reponse fields are returned in the response.

        The value of the `filters` parameter must be [URL-encoded](https://developer.mozilla.org/en-US/docs/Glossary/percent-encoding). If you want to use a plus sign `+` in the endpoint URL, you must replace the plus sign `+` with `%2B`. For example, if you use `/usage/stream-query?filters=(status='Pending' and startDateTime > '2018-04-04T13:32:37+08:00') ` in the endpoint URL, an error occurs. You have to use `/usage/stream-query?filters=(status='Pending' and startDateTime > '2018-04-04T13:32:37%2B08:00') ` instead.
      operationId: GET_UsageRecordsStreamQuery
      tags:
        - Usage (with Active Rating)
      parameters:
        - $ref: '#/parameters/GLOBAL_HEADER_Authorization_OAuth'
        - $ref: '#/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
        - $ref: '#/parameters/GLOBAL_HEADER_Zuora_Track_Id'
        - name: fields
          in: query
          description: |
            The fields of the usage records you want to retrieve. By default, all the fields in the **Responses** section are returned.

            Use commas to separate the field names. You can specify any fields described in the **Responses** section. For example: `/usage/stream-query?fields=tag,quantity,id,customFields.age`
          required: false
          type: string
        - name: filters
          in: query
          description: |
            This parameter restricts the data returned in the response. You can use this parameter to supply a dimension you want to filter on.

            A single filter uses the following form:

            *field_name* *operator* *field_value*

            Supported operators: `=`, `!=`, `>`, `<`, `>=`, `<=`, `IS NULL`, `IS NOT NULL`, `IN` (The letters are not case sensitive.)

            You can specify any fields, including the custom fields, described in the **Responses** section. Filters can be combined using the `AND` boolean logic. For example: *field_name* *operator* *field_value* AND *field_name* *operator* *field_value*

            Currently, the fields in filters must include at least one of the following fields: `accountNumber`, `unitOfMeasure`, `status`, `uniqueKey`, and `updatedOn`.

            Examples:

            - /usage/stream-query?filters= (id ='035e35bd-880a-47c9-99df-830143b13aed' AND status='Pending' AND customFields.age=20)

            - /usage/stream-query?fields=tag,id&filters= (quantity > 10 AND unitOfMeasure = 'GB')

            - /usage/stream-query?filters=(status in ('Pending','Rated'))
          required: false
          type: string
      responses:
        '200':
          description: OK
          headers:
            Zuora-Request-Id:
              type: string
              minLength: 36
              maxLength: 36
              description: |
                The Zuora internal identifier of the API call. You cannot control the value of this header.
            Zuora-Track-Id:
              type: string
              maxLength: 64
              description: |
                A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.
          schema:
            $ref: '#/definitions/QueryUsageResponseType'
          examples:
            application/json:
              data:
                - id: 63b75b21-64a8-410e-a391-13865261933c
                  accountNumber: A000003
                  tag: ChargeNumber:C-00000001
                  quantity: 50
                  unitOfMeasure: Each
                  groupId: B
                  startDateTime: '2017-02-03T00:00:00Z'
                  uniqueKey: null
                  description: null
