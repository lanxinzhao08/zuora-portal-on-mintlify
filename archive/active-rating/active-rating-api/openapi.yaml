swagger: '2.0'
info:
  version: '2020-02-10'
  title: Active Rating API
  x-logo:
    url: https://www.zuora.com/wp-content/uploads/2016/10/zuora-dev-logo-api-ref.svg
  description: ''
  contact:
    email: docs@zuora.com
host: rest.zuora.com
basePath: /
schemes:
  - https
consumes:
  - application/json; charset=utf-8
produces:
  - application/json; charset=utf-8
tags:
  - name: Usage (with Active Rating)
    description: |
      **Note:** The Usage (with Active Rating) operations are part of the [Active Rating](https://knowledgecenter.zuora.com/CB_Billing/J_Billing_Operations/H_Active_Rating) feature. You cannot use these operations with the [Usage](/v1-api-reference/api/usage) operations.

      If a 500 or 502 error occurs when you call any of the Usage (with Active Rating) operations, the first troubleshooting step is to retry the call.
paths:
  /usage:
    post:
      summary: Create usage records
      description: |
        **Note:** This operation is available only if Active Rating is enabled. The Active Rating feature is in development. If you wish to have access to the feature, submit a request at [Zuora Global Support](http://support.zuora.com/).

        Creates a single or multiple usage records for an account. The account that you want to create usage records for must have a corresponding usage-based rate plan charge.

        For more information about the usage data format, see [Usage Data Import](https://knowledgecenter.zuora.com/CB_Billing/J_Billing_Operations/H_Active_Rating/Usage_Data_Import).
      operationId: POST_UsageRecords
      tags:
        - Usage (with Active Rating)
      consumes:
        - application/vnd.zuora.usage-bulk+json;charset=UTF-8
      parameters:
        - $ref: '#/parameters/GLOBAL_HEADER_Authorization_OAuth'
        - $ref: '#/parameters/GLOBAL_HEADER_Zuora_Entity_Ids_Single'
        - $ref: '#/parameters/GLOBAL_HEADER_Zuora_Track_Id'
        - name: Content-Type
          in: header
          description: |
            The type of the request content.

            - If you create multiple usage records, you must specify the value of this parameter to `application/vnd.zuora.usage-bulk+json`.


            - If you create a single usage record, you do not need to specify this field.
          required: true
          type: string
        - name: body
          in: body
          required: true
          schema:
            $ref: '#/definitions/POSTUsageRecordRequestType'
      responses:
        '200':
          description: OK
          headers:
            Zuora-Request-Id:
              type: string
              minLength: 36
              maxLength: 36
              description: |
                The Zuora internal identifier of the API call. You cannot control the value of this header.
            Zuora-Track-Id:
              type: string
              maxLength: 64
              description: |
                A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.
          schema:
            $ref: '#/definitions/POSTUsageRecordResponseType'
          examples:
            application/json:
              data:
                - id: 448219e0-faa4-4fd7-b13e-ecd308a92454
                - id: 850fe5c1-8d2d-45e4-a01e-875a0199e108
        '400':
          description: Bad Request
          headers:
            Zuora-Request-Id:
              type: string
              minLength: 36
              maxLength: 36
              description: |
                The Zuora internal identifier of the API call. You cannot control the value of this header.
            Zuora-Track-Id:
              type: string
              maxLength: 64
              description: |
                A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.
          schema:
            $ref: '#/definitions/CommonUsageErrorResponse'
          examples:
            application/json:
              error:
                message: Invalid date format
                errors:
                  - objectName: usage
                    field: startDateTime
                    reason: InvalidDateFormat
                    message: Invalid date format
        '409':
          description: Conflict
          headers:
            Zuora-Request-Id:
              type: string
              minLength: 36
              maxLength: 36
              description: |
                The Zuora internal identifier of the API call. You cannot control the value of this header.
            Zuora-Track-Id:
              type: string
              maxLength: 64
              description: |
                A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.
          schema:
            $ref: '#/definitions/CommonUsageErrorResponse'
          examples:
            application/json:
              error:
                message: 'There is already a usage record with the same uniqueKey. The uniqueKey must be unique, value: abc'
                errors:
                  - objectName: usage
                    field: uniqueKey
                    reason: DuplicateValue
                    message: 'There is already a usage record with the same uniqueKey. The uniqueKey must be unique, value: abc'
        '500':
          description: Internal Server Error
          headers:
            Zuora-Request-Id:
              type: string
              minLength: 36
              maxLength: 36
              description: |
                The Zuora internal identifier of the API call. You cannot control the value of this header.
            Zuora-Track-Id:
              type: string
              maxLength: 64
              description: |
                A custom identifier for tracing the API call. If you specified a tracing identifier in the request headers, Zuora returns the same tracing identifier. Otherwise, Zuora does not set this header.
          schema:
            $ref: '#/definitions/CommonUsageErrorResponse'
          examples:
            application/json:
              error:
                message: An internal error occurred. Please retry the request.
      x-code-samples:
        - lang: Curl
          source: |-
            curl -X POST -H "Authorization: Bearer 6d151216ef504f65b8ff6e9e9e8356d3" -H "Content-Type: application/vnd.zuora.usage-bulk+json" -d '{
                "data": [
                    {
                        "accountNumber": "A00002689",
                        "description": "Disk usage for A00002689",
                        "groupId": "Group A",
                        "quantity": "15",
                        "startDateTime": "2017-01-14T21:32:00+08:00",
                        "tag": "AccountNumber:A00002689",
                        "unitOfMeasure": "Each"
                    },
                    {
                        "accountNumber": "A00002689",
                        "description": "Disk usage for A00002689",
                        "groupId": "Group B",
                        "quantity": "15",
                        "startDateTime": "2017-01-14T21:32:00+08:00",
                        "tag": "AccountNumber:A00002689",
                        "unitOfMeasure": "Each"
                    }
                ]
            }' "https://rest.zuora.com/usage"
