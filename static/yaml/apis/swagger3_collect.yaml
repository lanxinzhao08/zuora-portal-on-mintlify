      description: |
        Updates the collections agent that is displayed within the UI of Collections Window, and the custom field for the agent displayed in account details in the Zuora UI.


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Collections Window
      parameters:
        - in: path
          name: account_id
          required: true
          schema:
            type: string
          description: The account ID.
          example: "2c92c0f86680fd090166a578754812bd"
        - in: query
          name: agent_email
          required: true
          schema:
            type: string
          description: The email of the agent.
          example: "jdoe@company.com"

      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the operation is successful.
              examples:
                response:
                  value:
                    success: true

