                    uri: http://company.com/v3/admin/users/b859f5dd-8184-4d01-8bf9-e3e771f68a62
        '400':
          description: Bad Request
          headers: {}
      summary: Create an admin user
      operationId: createAdminUser
      description: Creates a new admin user.
      tags:
      - Admin User
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                identifiers:
                  type: object
                  properties:
                    email_address:
                      type: string
                validators:
                  type: object
                  properties:
                    password:
                      type: string
                    use_sso:
                      type: boolean
                      description: When this is present there should be no identifiers
                        in the body. The user is identified through a `blaize_session`
                        cookie.
              required:
              - identifiers
              example:
                identifiers:
                  email_address: joe.blow@company.com
                validators:
                  password: mysecurepassword123
