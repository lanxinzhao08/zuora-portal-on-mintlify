                example: fffd4076-d0cd-45a4-89f3-56ae8aea31f0
            required:
            - entitlement_type
            - entitlement_id
            - product_id
            example:
              entitlement_type: bundle
              entitlement_id: XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
              startTime: '2022-06-01 00:00:00'
              endTime: '2022-12-31 23:59:59'
              product_id: XXXXXXXXXXXXXX
