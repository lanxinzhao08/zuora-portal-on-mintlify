definitions:
  POSTUsageRecordRequestType:
    example:
      data:
        - accountNumber: A00002689
          tag: AccountNumber:A00002689
          quantity: '15'
          unitOfMeasure: Each
          startDateTime: '2017-01-14T21:32:00+08:00'
          description: Disk usage for A00002689
          groupId: Group A
        - accountNumber: A00002689
          tag: AccountNumber:A00002689
          quantity: '15'
          unitOfMeasure: Each
          startDateTime: '2017-01-14T21:32:00+08:00'
          description: Disk usage for A00002689
          groupId: Group B
    type: object
    properties:
      data:
        description: |
          (Conditional) This field is only used for creating multiple usage records. If you create a single usage record, you do not need to specify the `data` field in the request.

          An array of usage records information.
        type: array
        items:
          $ref: '#/definitions/POSTUsageType'
  POSTUsageType:
    title: data
    type: object
    required:
      - accountNumber
      - quantity
      - startDateTime
      - tag
      - unitOfMeasure
    properties:
      accountNumber:
        type: string
        maxLength: 70
        description: |
          The account number associated with the usage record. The customer account must be the subscription owner.

          The account number must be valid, and the account must be active.
      customFields:
        $ref: '#/definitions/CustomFields'
      description:
        type: string
        maxLength: 200
        description: |
          The description of the usage record.
      quantity:
        type: number
        format: double
        description: |
          The number of units the usage record is used.
      uniqueKey:
        type: string
        maxLength: 50
        description: |
          A unique key of the usage record. You can define the unique key for each usage record.
      startDateTime:
        type: string
        format: date-time
        description: |
          The start date and time when the usage is consumed.


          See [supported date and time format](https://knowledgecenter.zuora.com/CB_Billing/WA_Dates_in_Zuora/A_Date_and_dateTime_Format#section_2).
      tag:
        type: string
        maxLength: 255
        description: |
          Specifies which subscription, charge, or account the usage record is related to.

          The value of this field must be in the following formats:

          - SubscriptionNumber:*value*
          - ChargeNumber:*value*
          - AccountNumber:*value*

          For example, ChargeNumber:C-00000002

          If the value of this field is in AccountNumber:*value* format, the value must be the same as the value of the `accountNumber` field.

          If the value of this field is in the ChargeNumber:*value* format, the value must be the same as the value of the `unitOfMeasure` field corresponding to the usage charge.

          The subscription number, charge number, and account number must be active, and the subscription cannot be in Draft status.

          The customer account must be the subscription and charge owner.
      unitOfMeasure:
        type: string
        maxLength: 50
        description: |
          The unit used to measure the usage.

          The value of this field is case insensitive.
      groupId:
        type: string
        maxLength: 50
        description: |
          The group ID used for [usage rating by group](https://knowledgecenter.zuora.com/CB_Billing/J_Billing_Operations/Usage/Usage_Rating_by_Group). Zuora groups the usage records based on the group ID when you choose the Custom Group option for usage rating.


          **Note:** The Usage Rating by Group feature is in **Limited Availability**. If you wish to have access to the feature, submit a request at [Zuora Global Support](http://support.zuora.com/).
  PUTUsageType:
    type: object
    example:
      quantity: '15'
      unitOfMeasure: Each
      startDateTime: '2017-01-14T21:00:00+08:00'
      description: Disk usage for A00002689
    properties:
      customFields:
        $ref: '#/definitions/CustomFields'
      description:
        type: string
        maxLength: 200
        description: |
          The description of the usage record.
      quantity:
        type: number
        format: double
        description: |
          The number of units the usage record is used.
      startDateTime:
        type: string
        format: date-time
        description: |
          The start date and time when the usage is consumed. See [supported date and time format](https://knowledgecenter.zuora.com/CB_Billing/WA_Dates_in_Zuora/A_Date_and_dateTime_Format#section_2).
      unitOfMeasure:
        type: string
        maxLength: 50
        description: |
          The definable unit used to measure consumed usage.
  QueryUsageResponseType:
    type: object
    properties:
      data:
        type: array
        description: |
          An array of usage records information.
        items:
          $ref: '#/definitions/GETUsageResponseType'
  GETUsageResponseType:
    type: object
    title: data
    properties:
      accountNumber:
        type: string
        maxLength: 70
        description: |
          The account number associated with this usage record.
      createdBy:
        type: string
        maxLength: 36
        description: |
          The ID of the user who created this usage record.
      createdOn:
        type: string
        format: date-time
        description: |
          The start date and time when this usage record is created.
      customFields:
        $ref: '#/definitions/CustomFields'
      description:
        type: string
        maxLength: 200
        description: |
          The description of this usage record.
      fileName:
        type: string
        maxLength: 50
        description: |
          The name of the import file when the usage record is imported from the file.
      groupId:
        type: string
        maxLength: 50
        description: |
          The group ID used for [usage rating by group](https://knowledgecenter.zuora.com/CB_Billing/J_Billing_Operations/Usage/Usage_Rating_by_Group). Zuora groups the usage records based on the group ID when you choose the Custom Group option for usage rating.

            **Note:** The Usage Rating by Group feature is in **Limited Availability**. If you wish to have access to the feature, submit a request at [Zuora Global Support](http://support.zuora.com/).
      id:
        type: string
        maxLength: 36
        description: |
          The ID of this usage record.
      importId:
        type: string
        maxLength: 36
        description: |
          The ID of the usage import if this usage record is imported through a usage file.
      quantity:
        type: number
        format: double
        description: |
          The number of units this usage record is used.
      startDateTime:
        type: string
        format: date-time
        description: |
          The start date and time when this usage is consumed.
      status:
        type: string
        enum:
          - Pending
          - Rated
          - Processed
        description: |
          The status of this usage record.
      tag:
        type: string
        maxLength: 50
        description: |
          Specifies which subscription, charge, or account this usage record is related to.
      uniqueKey:
        type: string
        maxLength: 50
        description: |
          A unique key of this usage record. You can define the unique key for each usage record.
      unitOfMeasure:
        type: string
        maxLength: 50
        description: |
          The unit used to measure the usage.
      updatedBy:
        type: string
        maxLength: 36
        description: |
          The ID of the user who last updated this usage record.
      updatedOn:
        type: string
        format: date-time
        description: |
          The date and time when this usage record is last updated.
  POSTUsageRecordResponseType:
    type: object
    properties:
      data:
        description: |
          (Conditional) This field is only returned in the response if you create multiple usage records. If you create a single usage record, this field will not be returned in the response.

          An array of usage record IDs you created.
        type: array
        items:
          type: object
          title: data
          properties:
            id:
              type: string
              description: |
                The ID of the usage record.
  PUTUpdateUsageResponseType:
    type: object
    properties:
      id:
        type: string
        description: |
          The ID of the usage record that is updated.
  DELETEUsageResponseType:
    type: object
    properties:
      success:
        type: boolean
        description: |
          Indicates whether the call succeeded.
  CustomFields:
    type: object
    title: customFields
    description: |
      Container for custom fields.
    additionalProperties:
      description: |
        Custom fields. Custom field names are case sensitive. For more information about custom fields, see [Custom Fields](/archive/active-rating/active-rating-api).
  CommonUsageErrorResponse:
    type: object
    properties:
      error:
        type: object
        description: |
          Container for the error information.
        properties:
          message:
            description: |
              The error message that is returned. If multiple errors occurred, the first error message is returned in this field.
            type: string
          errors:
            type: array
            description: |
              Container for the information about detailed errors.
            items:
              type: object
              title: errors
              properties:
                objectName:
                  description: |
                    The object where the error occurred.
                  type: string
                field:
                  description: |
                    The field where the error occurred.
                  type: string
                reason:
                  description: |
                    The reason for the error.
                  type: string
                message:
                  description: |
                    The error message that is returned.
                  type: string
  POSTUsageImportResponseType:
    type: object
    properties:
      id:
        type: string
        description: |
          The ID of the usage import.
      status:
        type: string
        maxLength: 32
        description: |
          The processing status of the usage import file.

          Possible values:
          - `PENDING`: The usage import file is waiting to be processed.
          - `PROCESSING`: The usage import file is being processed.
          - `COMPLETED`: The processing of the usage import file is completed successfully.
          - `VALIDATION_FAILED`: The processing of the usage import file is completed with validation errors. If a validation error occurs in one usage record, no usage records will be imported from the usage import file.
          - `IMPORTED_WITH_ERRORS`: The usage import file is imported with errors because of some exceptions. Not all usage records are imported from the usage import file. If this status is displayed, contact [Zuora Global Support](http://support.zuora.com/) for help.
          - `FAILED`: The usage import file fails to be processed.
        enum:
          - PENDING
          - PROCESSING
          - COMPLETED
          - VALIDATION_FAILED
          - IMPORTED_WITH_ERRORS
          - FAILED
  UsageImports:
    type: object
    properties:
      data:
        type: array
        description: |
          An array of usage imports information.
        items:
          $ref: '#/definitions/UsageImport'
  UsageImport:
    type: object
    title: data
    properties:
      id:
        type: string
        maxLength: 36
        description: |
          The ID of the usage import.
      name:
        type: string
        maxLength: 50
        description: |
          The name of the import file.
      description:
        type: string
        maxLength: 255
        description: |
          The description of the import file.

          You can add some comments about the import file in this field. For example, `This import file contains 50 usage records related to four customer accounts.`
      status:
        type: string
        maxLength: 32
        description: |
          The processing status of the usage import file.

          Possible values:
          - `PENDING`: The usage import file is waiting to be processed.
          - `PROCESSING`: The usage import file is being processed.
