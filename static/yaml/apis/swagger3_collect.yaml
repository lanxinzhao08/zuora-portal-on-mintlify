      type: object
      properties:
        statements:
          type: array
          items:
            type: object  
          description: |
            An array containing the requested number of statements of the specified account. Every object contains an Amazon S3 link. You can click the links to view and download the statements. The links will expire in 10 minutes.
        success:
          type: boolean
          description: |
            Whether the operation is successful.
        count:
          type: integer
          description: |
            The number of statements retrieved.
    GETStatementSettingsResponse:
      type: object
      properties:
        success:
          type: boolean
          description: |
            Whether the operation is successful.
        templates:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the template.
          description: |
            An array containing all available templates.
        advanced_ar:
          type: boolean
          description: |
            Whether Invoice Settlement is enabled on the tenant.
        default_template:
          type: string
          description: |
            The name of the default template.
        default_cycle:
          type: string
          description: |
            The statement cycle being used.
    POSTAdhocStatementRun:
      type: object
      properties:
        starting_date:
          type: string
          format: date
          description: >
            The starting date of the time period for which the statement is generated, in the format of
            MM-DD-YYYY.
        ending_date:
          type: string
          format: date
          description: >
            The ending date of the time period for which the statement is generated, in the format of
            MM-DD-YYYY.
        template_name:
          type: string
          description: >
            The name of the template to be used in the statement run.
        advanced_ar:
          type: boolean
          description: >
            Specifies whether Invoice Settlement is enabled on the tenant.   
        account_id:
          type: string
          description: >
            The ID of the account for which the statement run is created.
        attach_to_account:
          type: boolean
          description: |
            Indicates whether the generated statement is attached to the account.

      required:
        - starting_date
        - ending_date
        - template_name
        - advanced_ar
        - account_id

      example:
        starting_date: "05-01-2018"
        ending_date: "08-01-2018"
        template_name: "Default Name"
        advanced_ar: false
        account_id: "2c92c0f964eaa3ec0164fad1eab730d6"
        attach_to_account: true
    POSTAdhocStatementRunResponse:
      type: object
      properties:
        success:
          type: boolean
          description: |
            Whether the operation is successful.
        code:
          type: integer
          description: |
            The response code.
        message:
          type: string
          description: |
            The response message.
        statement_number:
          type: string
          description: |
            The number of the statement.
    POSTCustomStatementRun:
      type: object
      properties:
        starting_date:
          type: string
          format: date
          description: >
            The starting date of the time period for which the statement is generated, in the format of
            MM-DD-YYYY.
        ending_date:
          type: string
          format: date
          description: >
            The ending date of the time period for which the statement is generated, in the format of
            MM-DD-YYYY.
        batch:
          type: string
          description: >
            The billing batch of accounts the statements need to be generated for.
        mode:
          type: string
          description: >
            The mode in which the run has to be executed.
          enum:
            - open_invoices
            - open_balance
            - no_invoice
            - no_invoice_w_balance
            - custom  
      required:
        - starting_date
        - ending_date
        - batch
        - mode 
      example:
        starting_date: "05-01-2018"
        ending_date: "08-01-2018"
        batch: "Batch40"
        mode: "custom"
    POSTCustomStatementRunResponse:
      type: object
      properties:
        success:
          type: boolean
          description: |
            Whether the operation is successful.
        code:
          type: integer
          description: |
            The response code.
        message:
          type: string
          description: |
            The response message.
        execution_number:
          type: string
          description: |
            The serial number of the execution.
        report_file:
          type: string
          description: |
            The URL pointing to the report of the run.
