# Notes object definition
    NotesObject:
      type: object
      properties:
        success:
          type: boolean
          description: Whether this operation is successful or not.
        data:
          type: object
          properties: 
            id:
              type: integer
              description: The ID of the Notes object.
            object:
              type: string
              description: 
                The type of the object. It can be "Accounts" or "Invoices" for Collections Window.
            notesId:
              type: string
              description:
                The ID of the Notes object. It is an account number (32-digit hex) for Accounts object type, and an invoice number for Invoices object type.
            notesParentId:
              type: string
              description:
                The ID of the parent object. For "Accounts" object, this parameter is the account name that the Notes object is created for.
            createdAt:
              type: string
              format: time-date
              description: 
                The time and date when this Notes object is created.
            updatedAt:
              type: string
              format: time-date
              description:
                The last time and date when the Notes object is updated.
    NotesObjectWithComment:
      type: object
      properties:
        success:
          type: boolean
          description: Whether this operation is successful or not.
        data:
          type: object
          properties:
            id:
              type: integer
              description: The ID of the Notes object.
            object:
              type: string
              description: 
                The type of the object. It can be "Accounts" or "Invoices" for Collections Window.
            notesId:
              type: string
              description:
                The ID of the notes object. It is an account number (32-digit hex) for Accounts object type, and an invoice number for Invoices object type.
            notesParentId:
              type: string
              description:
                The ID of the parent object. For "Accounts" object, this parameter is the account name that the Notes object is created for.
            createdAt:
              type: string
              format: time-date
              description: 
                The time and date when this Notes object is created.
            updatedAt:
              type: string
              format: time-date
              description:
                The last time and date when the Notes object is updated.
            comments:
              type: array
              description: The array of comments for this Notes object.
              items:
                $ref: '#/components/schemas/NotesComment'
# definition for Notes user
    NotesUser:
      type: object
      properties:
        id:
          type: integer
          description: The ID of the Notes user.
        username:
          type: string
          description: The user name.
        connectIdentity:
          type: string
          description: The connect ID of the user. It must be a 32-digit hex number.
        email:
          type: string
          description: The email address of the user.
        firstName:
          type: string
          description: The first name.
        lastName:
          type: string
          description: The last name.
        fullName:
          type: string
          description: The full name of the user.
        platformRole:
          type: string
          description: The Platform role of the user.
        timeZone:
          type: string
          description: The time zone setting for the user.
        createdAt:
          type: string
          format: time-date
          description: 
            The time and date when this user record is created.
        updatedAt:
          type: string
          format: time-date
          description:
            The last time and date when the user record is updated.
        escalationUser:
          type: string
          description: The full name of the user that is configured to handle escalations for the current user.
        escalationUserId:
          type: string
          description: The ID of the escalation user. It must be a 32-digit hex number.
        approvalAmount:
          type: number
          description: The amount of money that this user is allowed to approve.
        avatar:
          type: string
          description: The link to the avatar image file for the user.
