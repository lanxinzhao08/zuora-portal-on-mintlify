        schema:
          type: string
      x-mint:
        href: "/zephr-api-reference/zephr-admin-api/account-user/saveaccountuser"
  "/zephr/integration/users/v1/users":
    delete:
      summary: Delete an end user by primary ID or foreign key
      operationId: deleteUserByPrimaryOrForeignKey
      description: "Deletes an end user and associated data from the system.\n\nThis
        endpoint applies to **end users (C2 users)**, not admin users.\n\nYou must
        provide **exactly one** of the following identifier options:\n  **Option A
        — Delete by primary ID**\n  - `primary_id`\n  **Option B — Delete by foreign
        key**\n  - `foreign[system]` and `foreign[key]`\n\n**Rules**\n  - Provide
        **either** `primary_id` **or** both `foreign[system]` and `foreign[key]`.\n
        \ - Do **not** provide both identifier options in the same request.\n  - If
        parameters are missing, incomplete, or conflicting, the API returns **400**.\n\n**Important:**
        \ \nTo delete JWT users who do not have a foreign system mapping (for example,
        users whose data exists in DynamoDB but not in the SQL database), provide
        `zephr` as the value for the `foreign[system]` parameter.\n\nExamples:\n  -
        Delete by primary ID:  \n    `DELETE /zephr/integration/users/v1/users?primary_id=123456`\n\n
        \ - Delete by foreign key:\n    `DELETE /zephr/integration/users/v1/users?foreign[system]=my-system&foreign[key]=alexuser-12345`\n\n
        \ - Delete JWT user with no foreign mapping (DynamoDB-only):  \n   `DELETE
        /zephr/integration/users/v1/users?foreign[system]=zephr&foreign[key]=alexuser-12345`\n"
      tags:
      - Users
      parameters:
      - name: primary_id
        in: query
        description: |
          The Zephr internal primary user ID of the user to be deleted.
          Provide this parameter **only** when deleting by primary ID (Option A).
        required: false
        schema:
          type: string
          example: '123456'
      - name: foreign[system]
        in: query
        description: |
          The configured foreign key system defined in the JWT settings.
          Required when deleting by foreign key (Option B).
        required: false
        example: zephr
        schema:
          type: string
      - name: foreign[key]
        in: query
        description: |
          The external persistent user identifier linked to the user (from the JWT).
          Required when deleting by foreign key (Option B).
        required: false
        example: user_998877
        schema:
          type: string
      responses:
        '204':
          description: Deleted successfully (no content).
        '400':
          description: Bad request (missing, incomplete, or conflicting query parameters).
        '404':
          description: User not found.
      x-mint:
        href: "/zephr-api-reference/zephr-admin-api/users/deleteuserbyprimaryorforeignkey"
  "/v3/admin/users":
    post:
      responses:
        '201':
          description: Created
          headers: {}
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/admin-user-response"
              examples:
                response:
                  value:
                    user_id: b859f5dd-8184-4d01-8bf9-e3e771f68a62
