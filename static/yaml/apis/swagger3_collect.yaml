info:
  version: '2024-06-03'
  title: 'Collections API Reference'
  x-logo:
    url: https://www.zuora.com/wp-content/uploads/2016/10/zuora-dev-logo-api-ref.svg

  description: >

    # Introduction


    This is the REST API reference for Zuora Collections. This reference provides detailed descriptions about functions, requests, and responses of the APIs for the following two component apps. Rest APIs for other component apps will 
    be included in this reference when they are released.

    - Advanced Payment Manager

    - Collections Window

    - Configurable Payment Retry

    - Notes

    - Statement Generator


    
    **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).

    # Authentication

    Advanced Payment Manager, Collections Window, Configurable Payment Retry, and Statement Generator use basic authentication. The user name is your email address for logging in to Zuora. The password is the API token shown in the Collections feature's settings. Notes use API-token only for authentication. Alternatively, you can use "API-Token" as the header key and the API token shown in the Setting of Notes as the value.


    **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).

    # Base URLs

     Base URLs for different components are different. Click the drop-down arrow at the end of an endpoint to display the full endpoint.  

tags:
  - name: Advanced Payment Manager
    description: >
      Advanced Payment Manager APIs use basic authentication. The user name is the email address that you use for logging in Zuora. The password is the API token that is shown in the settings of Advanced Payment Manager.
      
      Before you use the APIs, ensure that you have completed the initial configurations of Advanced Payment Manager. To learn more about the configuration and usage of Advanced Payment Manager, see
      [Advanced Payment Manager](https://knowledgecenter.zuora.com/CE_Collect/CA_Advanced_Payment_Manager).  


      **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).

  - name: Collections Window
    description: >
      Collections Window APIs use basic authentication. The user name is the email address that you use for logging in Zuora. The password is the API token that is shown in the settings of Collections Window.

      To learn more about the configuration and usage of Collections Window, see [Collections Window](https://knowledgecenter.zuora.com/CE_Collect/Collections_Window).


      **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).

  - name: Configurable Payment Retry
    description: >
      Configurable Payment Retry APIs use basic authentication. The user name is the email address that you use for logging in Zuora. The password is the API token that is shown in the settings of Configurable Payment Retry.

      To learn more about the configuration and usage of Configurable Payment Retry, see [Configurable Payment Retry](https://knowledgecenter.zuora.com/CE_Collect/Configurable_Payment_Retry).

  - name: Notes
    description: >
      Notes APIs use API-token only for authentication. You need to use "API-Token" as the header key and the api token that is shown in the Setting of Notes as the value.  

      To learn more about the configuration and usage of Notes, see [Notes](https://knowledgecenter.zuora.com/CE_Collect/Notes).

      
      **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).

  - name: Statement Generator
    description: >

      Statement Generator APIs use basic authentication. The user name is the email address that you use for logging in Zuora. The password is the API token that is shown in the settings of Statement Generator.  

      To learn more about the configuration and usage of Statement Generator, see [Statement Generator](https://knowledgecenter.zuora.com/CE_Collect/Statement_Generator).  


      **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).

paths:
# Start of Advanced Payment Manager operations
  /api/v1/subscription_payment_runs/{payment_run_id}:
    get:
      servers:
        - url: https://advanced-payment-manager.apps.zuora.com
      operationId: GET_PaymentRun
      summary: Get a payment run
      description: >
        Gets details about a particular payment run based on a payment run id in
        Advanced Payment Manager. 


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Advanced Payment Manager
      parameters:
        - in: path
          name: payment_run_id
          required: true
          schema:
            type: integer
          description: The payment run ID. A payment run id in Advanced Payment Manager is different from a payment run id in Zuora.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GETPaymentRunResponse"
              examples:
                response:
                  value:
                    success: true
                    id: 6
                    status: Complete
                    target_date: 2018-01-02
                    filter: Account.Currency = 'CAD'
                    payment_run_schedule_id: Adhoc
                    invoices_held: {}
                    metrics:
                      documents: 0
                      payments: 0
                      failed: 0
                      skipped: 0
                      amount: 0
                      credit: 0

  /api/v1/subscription_payment_runs:
    post:
      servers:
        - url: https://advanced-payment-manager.apps.zuora.com
      description: >
        Creates a payment run to be executed immediately. You must specify the
        **target_date** field. You can specify one or more filters to determine
        which receivables are to be paid in the payment run.


        If you use a custom filter, you cannot use other filters. 


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).

      summary: Create a payment run
      operationId: POST_PaymentRun
      tags:
        - Advanced Payment Manager
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: "#/components/schemas/POSTPaymentRun"
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/POSTPaymentRunResponse"
            application/json:
              examples:
                response:
                  value:
                    id: 6
                    success: "true"
  /api/v1/payment_run_schedules:
    get:
      servers:
        - url: https://advanced-payment-manager.apps.zuora.com
      operationId: GET_PaymentRunSchedules
      summary: Get all payment run schedules
      description: |
        Retrieves all payment run schedules in Advanced Payment Manager.


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Advanced Payment Manager
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GETPaymentRunSchedulesResponse"
              examples:
                response:
                  value:
                    success: true
                    size: 3
                    schedules:
                      - id: 6
                        status: Active
                        filter: Account.BillCycleDay = 8
                        schedule: At 6:00 AM, only on Monday and Tuesday

    post:
      servers:
        - url: https://advanced-payment-manager.apps.zuora.com
      description: |
        Creates a payment run schedule. 


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      summary: Create a payment run schedule
      operationId: POST_PaymentRunSchedule
      tags:
        - Advanced Payment Manager
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: "#/components/schemas/POSTPaymentRunSchedule"
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json; charset=utf-8:
              schema:
                $ref: "#/components/schemas/POSTPaymentRunScheduleResponse"
            application/json:
              examples:
                response:
                  value:
                    id: 6
                    success: "true"
  "/api/v1/payment_run_schedules/{schedule_id}":
    get:
      servers:
        - url: https://advanced-payment-manager.apps.zuora.com
      operationId: GET_PaymentRunSchedule
      summary: Get a payment run schedule
      description: |
        Gets details about a particular payment run schedule.


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Advanced Payment Manager
      parameters:
        - in: path
          name: schedule_id
          required: true
          schema:
            type: integer
          description: The schedule ID
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GETPaymentRunScheduleResponse"
              examples:
                response:
                  value:
                    success: true
                    id: 6
                    status: Active
                    filter: Account.BillCycleDay = 8
                    schedule: At 6:00 AM, only on Monday and Tuesday
    put:
      servers:
        - url: https://advanced-payment-manager.apps.zuora.com
      operationId: PUT_PaymentRunSchedule
      summary: Update a payment run schedule
      description: |
        Updates details about a particular payment run schedule.


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Advanced Payment Manager
      parameters:
        - in: path
          name: schedule_id
          required: true
          schema:
            type: integer
          description: The schedule ID
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: "#/components/schemas/PUTPaymentRunSchedule"
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/POSTPaymentRunScheduleResponse"
              examples:
                response:
                  value:
                    id: 6
                    success: true
    delete:
      servers:
        - url: https://advanced-payment-manager.apps.zuora.com
      operationId: DELETE_PaymentRunSchedule
      summary: Cancel a payment run schedule
      description: |
        Cancels a payment run schedule.


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Advanced Payment Manager
      parameters:
        - in: path
          name: schedule_id
          required: true
          schema:
            type: integer
          description: The schedule ID
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DELETEPaymentRunScheduleResponse"
              examples:
                response:
                  value:
                    success: true

# start of Statement Generator operations
  /api/v1/fetch_statement?statement_number={statement_number}:
    get:
      servers:
        - url: https://statement-generator.apps.zuora.com
      operationId: GET_Statement
      summary: Get a statement
      description: |
        Gets details about a particular statement. The statement will be available for download in the response.


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Statement Generator
      parameters:
        - in: path
          name: statement_number
          required: true
          schema:
            type: integer
          description: The statement number
      responses:
        "200":
          description: ""

  /api/v1/fetch_statements?account_id={account_id}&count={count}:
    get:
      servers:
        - url: https://statement-generator.apps.zuora.com
      operationId: GET_Statements
      summary: Get multiple statements
      description: |
        Gets multiple statements for a specified account. The links to the downloadable statements will be included in the response.


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Statement Generator
      parameters:
        - in: path
          name: account_id
          required: true
          schema:
            type: integer
          description: The ID of the account
        - in: path
          name: count
          required: true
          schema:
            type: integer
          description: The number of statements you want to retrieve.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GETStatementsResponse"
              examples:
                response:
                  value:
                    success: true
                    count: 2
                    statements:
                      - statement_name: "STA00000232.pdf"
                        statement_time: "12/19/2018 11:19:26 EST"
                        s3_link: "https://rbm-apps.s3.amazonaws.com/StatementDataFeed/production/1311124/2c92c0f9692e5e4321692fcb1cd57936/STA00000232.pdf"
                        starting_date: "2018-05-01T00:00:00.000-04:00"
                        ending_date: "2018-12-19T00:00:00.000-05:00"
                      - statement_name: "STA00000076.pdf"
                        statement_time: "12/19/2018 11:13:57 EST"
                        s3_link: "https://rbm-apps.s3.amazonaws.com/StatementDataFeed/production/13555524/2c92c0f9876e5e4321692fcb1cd56666/STA00000076.pdf"
                        starting_date: "2018-08-01T00:00:00.000-04:00"
                        ending_date: "2018-12-19T00:00:00.000-05:00"

  /api/v1/fetch_settings:
    get:
      servers:
        - url: https://statement-generator.apps.zuora.com
      operationId: GET_Settings
      summary: Get Statement Generator settings
      description: |
        Gets several key settings of Statement Generator, including the available templates, whether Invoice Settlement is enabled on the tenant, the name of the default template, and the statement cycle being used.


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Statement Generator
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GETStatementSettingsResponse"
              examples:
                response:
                  value:
                    success: true
                    templates:
                      - name: "Default Template"
                      - name: "Template for end consumers"  
                    default_template: "Default Template"
                    default_cycle: "Month"
                    
  /api/v1/run:
    post:
      servers:
        - url: https://statement-generator.apps.zuora.com
      operationId: POST_AdhocStatementRun
      summary: Create an ad hoc statement run
      description: |
        Create an ad hoc statement run. 


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Statement Generator
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: "#/components/schemas/POSTAdhocStatementRun"
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/POSTAdhocStatementRunResponse"
              examples:
                response:
                  value:
                    success: true
                    code: 200
                    message: "Success"
                    statement_number: "STA00000008"
  /api/v1/execute:
    post:
      servers:
        - url: https://statement-generator.apps.zuora.com
      operationId: POST_CustomStatementRun
      summary: Create a custom statement run
      description: |
        Create a custom statement run. 


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Statement Generator
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              $ref: "#/components/schemas/POSTCustomStatementRun"
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/POSTCustomStatementRunResponse"
              examples:
                response:
                  value:
                    success: true
                    code: 200
                    message: "Success"
                    execution_number: "2"
                    report_file: "<aws_s3_link>"

# start of Notes operations
  /api/v1/notes?object={object}&notesId={notesId}:
    get:
      servers:
        - url: https://notes.apps.zuora.com
      operationId: GET_NotesObject
      summary: Get a Notes object
      description: |
        Gets a Notes object by its object type and ID.


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Notes
      parameters:
        - in: query
          required: true
          name: object
          schema:
            type: string
            example: "Accounts"
          description: The object type. The value can be "Accounts" or "Invoices" for Collections Window.
        - in: query
          required: true
          name: notesId
          schema:
            type: string
            example: "2c92c0f866a9a8fe0166bd04878b2867"
          description: The ID of the Notes object. It is an account number (32-digit hex) for Accounts object type, and an invoice number for Invoices object type.
        - in: header
          required: true
          name: API-Token
          description: The API token that is shown in the settings of Notes. It is a 64-digit hex number.
          schema:
            type: string
            example: "a48865e51c3f4610de8f319bdd7bf691b2aaad827ed31ad1dd6847e617200666"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesObject"
              example:
                success: true
                data:
                  id: 113
                  object: "Accounts"
                  notesId: "2c92c0f866a9a8fe0166bd04878b2867"
                  notesParentId: "Account Name Example"
                  createdAt: "2020-02-12T21:50:59.774Z"
                  updatedAt: "2020-02-12T21:50:59.774Z"
  /api/v1/notes:
    post:
      servers:
        - url: https://notes.apps.zuora.com
      operationId: POST_NotesObject
      summary: Create a Notes object
      description: |
        Creates a Notes object.


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Notes
      parameters:
        - in: header
          required: true
          name: API-Token
          description: The API token that is shown in the settings of Notes. It is a 64-digit hex number.
          schema:
            type: string
            example: "a48865e51c3f4610de8f319bdd7bf691b2aaad827ed31ad1dd6847e617200666"
      requestBody:
        content:
          application/json; charset=utf-8:
            schema:
              type: object
              properties:
                notes:
                  type: object
                  properties:
                    object:
                      type: string
                      description: 
                        The type of the object. It can be "Accounts" or "Invoices" for Collections Window.
                    notesId:
                      type: string
                      description:
                        The ID of the notes object that you need to specify. It is an account number (32-digit hex) for Accounts object type, and an invoice number for Invoices object type.
                    notesParentId:
                      type: string
                      description:
                        The ID of the parent object. For "Accounts" object, this parameter is the account name that the Notes object is created for.
              example:
                notes:
                  object: "Accounts"
                  notesId: "2c92c0f866a9a8fe0166bd04878b2867"
                  notesParentId: "Account Name Example"
        required: true
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesObject"
              example:
                success: true
                data:
                  id: 113
                  object: "Accounts"
                  notesId: "2c92c0f866a9a8fe0166bd04878b2867"
                  notesParentId: "Account Name Example"
                  createdAt: "2020-02-12T21:50:59.774Z"
                  updatedAt: "2020-02-12T21:50:59.774Z"
  /api/v1/notes/comments?notesId={notesId}&notesParentId={notesParentId}&object={object}:
    get:
      servers:
        - url: https://notes.apps.zuora.com
      operationId: GET_Comments
      summary: Get comments
      description: |
        Gets comments for a Notes object.


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Notes
      parameters:
        - in: query
          required: true
          name: notesId
          schema:
            type: string
            example: "2c92c0f866a9a8fe0166bd04878b2867"
          description: The ID of the Notes object. It is an account number (32-digit hex) for Accounts object type, and an invoice number for Invoices object type.
        - in: query
          required: true
          name: notesParentId
          schema:
            type: string
            example: "Account Name Example"
          description: The ID of the parent object. For Accounts object type, the notesParentId is an account name.
        - in: query
          required: true
          name: object
          schema:
            type: string
            example: "Accounts"
          description: The object type. The value can be "Accounts" or "Invoices" for Collections Window.

        - in: query
          name: start_date
          schema:
            type: string
            example: "2020-12-01"
          description: |
            The start date of the period within which the comments are exported.

        - in: query
          name: end_date
          schema:
            type: string
            example: "2020-12-31"
          description: |
            The end date of the period within which the comments are exported.



        - in: header
          required: true
          name: API-Token
          description: The API token that is shown in the settings of Notes. It is a 64-digit hex number.
          schema:
            type: string
            example: "a48865e51c3f4610de8f319bdd7bf691b2aaad827ed31ad1dd6847e617200666"
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotesObjectWithComment" 
              example:
                success: true
                data:
                  id: 113
                  object: "Accounts"
                  notesId: "2c92c0f866a9a8fe0166bd04878b2867"
                  notesParentId: "Account Name Example"
                  createdAt: "2020-02-12T21:50:59.774Z"
                  updatedAt: "2020-02-12T21:50:59.774Z"
