              account_manager: Company account manager
    Create_CompanyBody_v4:
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: The name of the company
              description:
                type: string
                description: The description of the company
              website:
                type: string
                description: The website of the company
              contact:
                type: string
