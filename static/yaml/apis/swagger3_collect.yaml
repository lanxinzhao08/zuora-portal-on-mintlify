  /api/v1/metrics/customer_group_over_time:
    get:
      servers:
        - url: https://payment-retry.apps.zuora.com
      operationId: GET_DocumentSuccessRateByCustomerGroup
      summary: Get the Document Success Rate metrics by customer group
      description: >
        Gets the Document Success Rate timeseries for each customer group over the past 6 months.
        The data of the current month will not be included. For example, if it is April 15th today, the data for April will not be included. Data for March and earlier will be shown.
      tags:
        - Configurable Payment Retry
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GETDocumentSuccessRateByCustomerGroupResponse"

  /api/v1/metrics/customer_group:
    get:
      servers:
        - url: https://payment-retry.apps.zuora.com
      operationId: GET_CustomerGroupMetrics
      summary: Get the Customer Group metrics
      description: >
        Gets the following metrics for each customer group that is in the active status:
          - Document Success Rate and trend
          - Retry Success Rate
          - Average Attempts
      tags:
        - Configurable Payment Retry
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GETCustomerGroupMetricsResponse"

components:
  schemas:
    GETCustomerGroupMetricsResponse:
      type: object
      properties:
        customer_groups:
          type: array
          description: |
            An array containing the following information for each customer group.
              - Customer group ID
              - Customer group name
              - Whether Smart Retry is enabled for this customer group
              - Document Success Rate indicating the percentage of billing documents that are successfully collected
              - The trend of change in Document Success Rate over the last 30 days
              - Retry Success Rate indicating the percentage of the successful payment attempts
              - Average Attempts indicating the average number of attempts required to recover funds
        success:
          type: boolean
          description: |
            Indicates whether the metrics are retrieved successfully.

            If no data is loaded yet, a 200 response code will be returned with the success field set to `true`. All expected fields will be present but the value will be `null`.
      example:
        {
          "customer_groups": [
            {
              "id": 1,
              "name": "batch22",
              "smart_retry": false,
              "document_success_rate": "17.17", 
              "document_success_rate_trend": "up",
              "retry_success_rate": "21.76",
              "average_attempts": "4.11"
            },
            {
              "id": 2,
              "name": "Smart Retry",
              "smart_retry": true,
              "document_success_rate": "74.17",
              "document_success_rate_trend": "down",
              "retry_success_rate": "81.21", 
              "average_attempts": "1.32"
            },
            { 
              "id": 4,
              "name": "All Remaining Customers",
              "smart_retry": false,
              "document_success_rate": "16.35",
              "document_success_rate_trend": "up",
              "retry_success_rate": "15.21",
              "average_attempts": "3.32"
            }
          ],
          "success": true
        }

    GETDocumentSuccessRateByCustomerGroupResponse:
      type: object
      properties:
        customer_groups:
          type: array
          description: |
            An array containing the Document Success Rate timeseries for each customer group represented by the customer group ID.
            A timeseries over the past 6 months is present in the format of `<month_year>: <document_success_rate>`. The data of the current month is not included. For example, if it is April 15th today, the data for April will not be included. Data for March and earlier will be shown.
        success:
          type: boolean
          description: |
            Indicates whether the metrics are retrieved successfully.

            If no data is loaded yet, a 200 response code will be returned with the success field set to `true`. All expected fields will be present but the value will be `null`.
      example:
        {
          "customer_groups": {
            "1": {
              "05_21": "17.53",
              "04_21": "13.21",
              "03_21": "14.92",
              "02_21": "8.99",
              "01_21": "34.25",
              "12_20": "12.30",
            },
            "2": {
              "05_21": "11.11",
              "04_21": "7.87",
              "03_21": "26.00",
              "02_21": "11.06",
              "01_21": "13.43",
              "12_20": "17.92",
            },
            "4": {
              "05_21": "11.13",
              "04_21": "9.17",
              "03_21": "17.20",
              "02_21": "19.06",
              "01_21": "12.43",
              "12_20": "15.92",
            }
          },
          "success": true
        }

    GETAmountRecoveredResponse:
      type: object
      properties:
        currency:
          type: array
          description: |
            An array containing the following information for each available currency.
            If no payment of a given currency has been processed over the last 30 days, the currency will not appear in the array.
              - The total amount recovered to date
              - The amount recovered over the last 30 days
        success:
          type: boolean
          description: |
            Indicates whether the metrics are retrieved successfully.

            If no data is loaded yet, a 200 response code will be returned with the success field set to `true`. All expected fields will be present but the value will be `null`.
      example:
        {
          "currency": {
            "USD": {
              "total_amount": "77515.21",
              "last_30_days": "1100.01"
            },
            "EUR": {
              "total_amount": "337.19",
              "last_30_days": "17.17"
            },
            "CAD": {
              "total_amount": "123954.10",
              "last_30_days": "5132.87"
            }
          },
          "success": true
        }

    GETBaselineMetricsResponse:
      type: object
      properties:
        retry_success_rate:
          type: number
          description: |
            The percentage of successful payment attempts for all customer groups on this Configurable Payment Retry instance so far.
            
            Retry Success Rate = Number of successful retry payment attempts / Total number of retry payments attempted

            Payment attempts here are any payment attempts executed by Configurable Payment Retry, excluding the initial payment run.
        retry_success_rate_trend:
          type: string
          description: |
            The trend of change in Retry Success Rate over the last 30 days.
        document_success_rate:
          type: number
          description: |
            The percentage of billing documents that are successfully collected, for all customer groups on this Configurable Payment Retry instance so far.
            
            Document Success Rate = Number of billing documents collected / Total number of billing documents attempted

            Billing documents collected are any invoices and debit memos that were paid through the payment attempt initiated by Configurable Payment Retry.
        document_success_rate_trend:
          type: string
          description: |
            The trend of change in Document Success Rate over the last 30 days.
        average_days_outstanding:
          type: number
          description: |
            The average number of days invoices and debit memos are unpaid before collection, for all customer groups on this Configurable Payment Retry instance so far.
        average_days_outstanding_trend:
          type: string
          description: |
            The trend of change in Average Days Outstanding over the last 30 days.
        success:
          type: boolean
          description: |
            Indicates whether the metrics are retrieved successfully.

            If no data is loaded yet, a 200 response code will be returned with the success field set to `true`. All expected fields will be present but the value will be `null`.
      example:
        {
          "retry_success_rate": "11.90",
          "retry_success_rate_trend": "down",
          "document_success_rate": "13.54",
          "document_success_rate_trend": "neutral",
          "average_days_outstanding": "4.76",
          "average_days_outstanding_trend": "up",
          "success": true
        }

    GETActiveInvoiceCycleResponse:
      type: object
      properties:
        cycles:
          type: array
          items:
            $ref: '#/components/schemas/GETInvoiceCycleElementResponse'
          description: |
            An array containing information of all active retry cycles for an invoice. See the schema and example for details.
      example:
        {
          "cycles": [
          {
            "account_id": "2c92c0f96bd69165016bdccdd6ce2f29",
            "invoice_id": "2c92c0f8778bf8cd017798168cb50e0b",
