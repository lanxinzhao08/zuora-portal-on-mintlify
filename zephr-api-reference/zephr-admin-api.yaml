                type: object
                properties:
                  url_pattern:
                    type: string
                  header_patterns:
                    type: object
                    properties:
                      Content-Type:
                        type: string
              cache:
                type: object
                properties:
                  origin:
                    type: boolean
                  decision_points:
                    type: boolean
            example:
              label: Test
              conditions:
                url_pattern: "^/forum"
                header_patterns:
                  Content-Type: "^text/html"
              cache:
                origin: false
                decision_points: false
    Create_CompanyBody:
