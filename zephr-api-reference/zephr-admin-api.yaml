  "/v4/thumbnails/upload-url":
    post:
      summary: Generate Thumbnail Upload URL
      operationId: generateThumbnailUploadUrl
      tags:
      - Component Library
      description: |
        Generates a pre-signed URL for securely uploading a thumbnail image. The link expires after *10 minutes*.

        **Considerations:**
        - Uploaded images are not optimized by the server; please upload images pre-optimized for web use.
        - Each uploaded file receives a unique `thumbnailId` for reference within your application, but the file name in the bucket is derived from this ID, ensuring no conflicts with existing files.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fileName:
                  type: string
                  description: The name of the file. Unique file names are recommended
                    but not enforced; the system generates a unique ID for each upload.
                contentType:
                  type: string
                  description: The MIME type of the file. Supported MIME types include
                    image/jpeg, image/png, and image/gif.
              example:
                fileName: unique-thumbnail.jpg
                contentType: image/jpeg
      responses:
        '200':
          description: Successfully generated URL for thumbnail upload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: A unique identifier for the uploaded thumbnail, used
                      for referencing in the application.
                  uploadUrl:
                    type: string
                    description: The pre-signed URL for uploading the thumbnail.
              examples:
                application/json:
                  value:
                    id: 4f5c49a5-e433-4ac1-b0ad-d67897988899
                    uploadUrl: https://zephr-thumbnails.s3.amazonaws.com/{generated-path}?...
        '400':
          description: The request is invalid. A required attribute is missing or
            an attribute did not meet the expected criteria.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                missingName:
                  value:
                    error: Please provide name of file to upload
                invalidType:
                  value:
                    error: Unsupported MIME type provided
        '401':
          description: Authentication credentials were not provided or are invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                missingCredentials:
                  value:
                    error: Authentication credentials are required
      x-mint:
        href: "/zephr-api-reference/zephr-admin-api/component-library/generatethumbnailuploadurl"
