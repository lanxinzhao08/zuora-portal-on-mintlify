#start of Collections Window operations                      
  /api/v1/accounts/{account_id}/update_status:
    post:
      servers:
        - url: https://collections-window.apps.zuora.com
      operationId: POST_Account
      summary: Update account status
      description: |
        Updates the status of an account. You must use the two query parameters to specify the status that you want to update, and the new value of the status.


        **Note**: The Collections Window, Notes, Advanced Payment Manager, Payment Plans, and Statement Generator features are entering end of support on June 3, 2024. For more information, please refer to the [Product and Feature End of Support page](https://knowledgecenter.zuora.com/Releases/ZProduct_and_feature_end_of_support_plan).
      tags:
        - Collections Window
      parameters:
        - in: path
          name: account_id
          required: true
          schema:
            type: string
          description: The account ID.
          example: "2c92c0f86680fd090166a578754812bd"
        - in: query
          name: status
          required: true
          schema:
            type: string
          description: The status that you want to update for the specified account. All statuses must be in lower case. Use underscore instead of space to define the status.
          example: "in_dispute"
        - in: query
          name: value
          schema:
            type: boolean
          description: The new value of the status. 0 indicates false, while 1 indicates true.
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    description: Whether the operation is successful.
              examples:
                response:
                  value:
                    success: true
                        
