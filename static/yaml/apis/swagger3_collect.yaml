    GETPaymentRunResponse:
      type: object
      properties:
        success:
          type: boolean
          description: |
            Whether the operation is successful.
        id:
          type: integer
          description: |
            The ID of the payment run in Advanced Payment Manager.
        status:
          type: string
          description: |
            The status of the payment run.
        target_date:
          type: string
          format: date
          description: |
            The target date of the payment run, in the format of YYYY-MM-DD.
        filter:
          type: string
          description: |
            The filter that is used for the payment run.
        payment_run_schedule_id:
          type: string
          description: >
            The ID of the payment run schedule. If this is not a scheduled
            payment run, the value is **Adhoc**.
        invoices_held:
          type: object
          description: |
            Invoices that are held by the payment run for manual processing.
        metrics:
          type: object
          description: |
            Metrics of the payment runs after completion.
        errors:
          type: array
          description: >
            Errors that occur in the operation. Available only when **success**
            is **false**.
          items: {}
    POSTPaymentRun:
      type: object
      properties:
        target_date:
          type: string
          format: date
          description: >
            The target date of the payment run to be created, in the format of
            YYYY-MM-DD.
        billrun:
          type: string
          description: >
            A bill run name that is used to determine what receivables should be
            included in the payment run. Valid only if the custom filter is not
            used.
        batch:
          type: string
          description: >
            A batch name that is used to determine what receivables should be
            included in the payment run. Valid only if the custom filter is not
            used.
        currency:
