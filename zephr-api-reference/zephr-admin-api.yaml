components:
  securitySchemes:
    ZephrHmacHttp:
      description: |-
        Requests to this API can be authenticated using an HMAC token signed with keys created in the admin console. For more information on signing requests with HMAC, see: https://developer.zuora.com/zephr-docs/zephr-api/zephr-api-tutorials/hmac-request-signing-and-key-pair/ For more information on generating keys for this, see: https://docs.zuora.com/en/zephr/configuration--integrations/admin-user-settings/manage-key-pairs

        The scheme name in the `Authorization` header, `ZEPHR-HMAC-*`, includes the signing algorithm as the final part of the name. For example: `ZEPHR-HMAC-SHA-256`.
      type: http
      scheme: ZEPHR-HMAC-*
